<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Movie Manager{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f7fb;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin: 20px 0;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #263449;
            color: white;
        }

        .button {
            display: inline-block;
            padding: 9px 13px;
            border: 0;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            background: #2457c5;
            color: white;
            font-size: 14px;
        }

        .delete-button {
            background: #c62828;
        }

        .form-card {
            background: white;
            padding: 24px;
            border-radius: 8px;
            max-width: 550px;
        }

        input {
            padding: 9px;
            width: 100%;
            box-sizing: border-box;
            margin: 6px 0 14px;
        }

        .errorlist {
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
