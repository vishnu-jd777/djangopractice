<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favourite Film</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="form-card">
        <h1>Your Favourite Film</h1>
        <p class="subtitle">Tell us a little about yourself.</p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="{{ form.name.id_for_label }}">Your name</label>
                {{ form.name }}
                {{ form.name.errors }}
            </div>

            <div class="form-group">
                <label for="{{ form.fav_film.id_for_label }}">
                    Favourite film
                </label>
                {{ form.fvt }}
                {{ form.fvt.errors }}
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
